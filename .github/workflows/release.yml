# Signed release (V5 Phase 7.4.2). SKELETON: it builds + signs the desktop app and attaches an SBOM.
# The signing keys live ONLY in CI secrets (TAURI_SIGNING_PRIVATE_KEY + its password) and are
# provisioned by a maintainer (Task 7.4.3 — a HUMAN-GATE). Until those secrets exist, do not cut a
# public release. Triggered on a version tag or manual dispatch — never on every push.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # for SLSA/provenance attestation

jobs:
  release:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - run: bun install
      # Build + sign. tauri-action signs the updater artifacts with the pinned key's private half
      # when these secrets are present; without them the build is unsigned (and must NOT be published).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: GlaudeCode ${{ github.ref_name }}
      # SBOM (CycloneDX) attached to the release for supply-chain transparency.
      - name: Generate SBOM
        run: bunx @cyclonedx/cyclonedx-npm --output-file sbom.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}
          path: sbom.json
