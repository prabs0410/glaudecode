# CI + secure-defaults release gate (V5 Phase 7.3). Builds + tests every package; the engine job runs
# the secure-defaults gate (secureDefaults.test.ts) so a regression — an unclassified RpcMethod, a
# removed wildcard guard, a missing governance doc — FAILS the build, not just review.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    name: engine (test + typecheck + secure-defaults gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: packages/engine
      - run: bunx tsc --noEmit
        working-directory: packages/engine

  desktop:
    name: desktop (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
        working-directory: packages/desktop
      - run: bunx vite build
        working-directory: packages/desktop

  rust:
    name: rust (cargo check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable # ref selects the toolchain channel — not SHA-pinnable
      # Tauri's Linux runtime deps (WebKitGTK etc.) are needed even for `cargo check`.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - run: cargo check
        working-directory: packages/desktop/src-tauri
      # The authoritative arming gate + the hostile-input bridge decoder are unit-tested here (M20);
      # a dropped check / inverted bool / decoder regression must FAIL the build, not just review.
      - run: cargo test
        working-directory: packages/desktop/src-tauri
